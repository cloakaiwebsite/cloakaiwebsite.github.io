<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Prepare with ChatGPT or Claude, then use CloakAI live">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0b2418"/></linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg2)"/>
  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff">Prepare with a chatbot, <tspan fill="#2ecc71">show up</tspan> with a co-pilot</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(80,150)">
      <rect width="470" height="300" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="30" y="52" font-size="22" font-weight="800" fill="#c9d6cf">Before: ChatGPT / Claude</text>
      <text x="30" y="104" font-size="17" fill="#c9d6cf">•  Research the company and role</text>
      <text x="30" y="146" font-size="17" fill="#c9d6cf">•  Draft and refine STAR stories</text>
      <text x="30" y="188" font-size="17" fill="#c9d6cf">•  Practise answers out loud</text>
      <text x="30" y="230" font-size="17" fill="#c9d6cf">•  Anticipate follow-up questions</text>
      <text x="30" y="276" font-size="15" fill="#7f9488">Great for prep. Not usable live.</text>
    </g>
    <text x="600" y="308" text-anchor="middle" font-size="40" fill="#2ecc71">→</text>
    <g transform="translate(650,150)">
      <rect width="470" height="300" rx="16" fill="#2ecc71" fill-opacity="0.07" stroke="#2ecc71" stroke-opacity="0.4"/>
      <text x="30" y="52" font-size="22" font-weight="800" fill="#2ecc71">During: CloakAI</text>
      <text x="30" y="104" font-size="17" fill="#eaf3ee">•  Real-time answers as you are asked</text>
      <text x="30" y="146" font-size="17" fill="#eaf3ee">•  Grounded in your resume</text>
      <text x="30" y="188" font-size="17" fill="#eaf3ee">•  Invisible on screenshare</text>
      <text x="30" y="230" font-size="17" fill="#eaf3ee">•  Solves on-screen coding problems</text>
      <text x="30" y="276" font-size="15" fill="#9fb3a8">The tool for the actual interview.</text>
    </g>
  </g>
</svg>
