<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="What you see versus what the interviewer sees on screen share">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0d2b1d"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.55"><stop offset="0" stop-color="#00ff88" stop-opacity="0.28"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#2ecc71" stroke-opacity="0.06" stroke-width="1"><path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/><path d="M150 0V630M350 0V630M550 0V630M750 0V630M950 0V630"/></g>
  <text x="80" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Your screen vs the shared stream</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="120" y="180" width="420" height="240" rx="14" fill="#06120c" stroke="#2ecc71" stroke-opacity="0.3"/>
    <text x="330" y="215" text-anchor="middle" font-size="18" font-weight="800" fill="#c9d6cf">What YOU see</text>
    <rect x="150" y="235" width="360" height="120" rx="8" fill="#0a1f15" stroke="#ffffff" stroke-opacity="0.06"/>
    <rect x="330" y="270" width="160" height="70" rx="8" fill="#0d2b1d" stroke="#00ff88" stroke-opacity="0.7"/>
    <circle cx="348" cy="290" r="5" fill="#00ff88"/><text x="360" y="295" font-size="12" font-weight="700" fill="#00ff88">Answer</text>
    <rect x="346" y="306" width="120" height="7" rx="3" fill="#2ecc71" fill-opacity="0.5"/>
    <text x="330" y="392" text-anchor="middle" font-size="14" fill="#9fb3a8">overlay visible to you</text>

    <rect x="660" y="180" width="420" height="240" rx="14" fill="#06120c" stroke="#2ecc71" stroke-opacity="0.3"/>
    <text x="870" y="215" text-anchor="middle" font-size="18" font-weight="800" fill="#c9d6cf">What THEY see</text>
    <rect x="690" y="235" width="360" height="120" rx="8" fill="#0a1f15" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="870" y="392" text-anchor="middle" font-size="14" fill="#00ff88">overlay removed by content protection</text>
    <path d="M545 300 h108" stroke="#00ff88" stroke-width="3" stroke-opacity="0.5"/><path d="M645 293 l10 7 l-10 7" fill="none" stroke="#00ff88" stroke-width="3"/>
  </g>
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6f8378">Invisibility applies to the screen-share stream, not to a person, a webcam, or a locked-down proctor.</text>
</svg>