<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="How cloaked AI stays invisible on screen capture">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0b2418"/></linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg2)"/>
  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="900" fill="#ffffff">The same screen, two points of view</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- What you see -->
    <g transform="translate(70,110)">
      <rect width="500" height="340" rx="16" fill="#0a1f15" stroke="#2ecc71" stroke-opacity="0.35"/>
      <text x="24" y="44" font-size="18" font-weight="800" fill="#2ecc71">What YOU see</text>
      <rect x="24" y="66" width="452" height="150" rx="10" fill="#06120c" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="90" cy="141" r="34" fill="#173a28"/>
      <text x="90" y="150" text-anchor="middle" font-size="30">🧑‍💼</text>
      <text x="150" y="120" font-size="15" fill="#9fb3a8">Interviewer on the call</text>
      <rect x="300" y="96" width="150" height="90" rx="10" fill="#0d2b1d" stroke="#00ff88" stroke-opacity="0.7"/>
      <text x="316" y="122" font-size="12" font-weight="700" fill="#00ff88">CloakAI</text>
      <rect x="316" y="134" width="118" height="8" rx="4" fill="#2ecc71" fill-opacity="0.5"/>
      <rect x="316" y="150" width="96" height="8" rx="4" fill="#2ecc71" fill-opacity="0.35"/>
      <rect x="316" y="166" width="118" height="8" rx="4" fill="#2ecc71" fill-opacity="0.35"/>
      <text x="24" y="262" font-size="15" fill="#c9d6cf">Your answer, floating over the call.</text>
      <text x="24" y="292" font-size="15" fill="#c9d6cf">Right where you need it.</text>
    </g>
    <!-- What they see -->
    <g transform="translate(630,110)">
      <rect width="500" height="340" rx="16" fill="#0a1f15" stroke="#ef4444" stroke-opacity="0.3"/>
      <text x="24" y="44" font-size="18" font-weight="800" fill="#ef4444">What THEY see on screenshare</text>
      <rect x="24" y="66" width="452" height="150" rx="10" fill="#06120c" stroke="#ffffff" stroke-opacity="0.08"/>
      <circle cx="90" cy="141" r="34" fill="#173a28"/>
      <text x="90" y="150" text-anchor="middle" font-size="30">🧑‍💼</text>
      <text x="150" y="120" font-size="15" fill="#9fb3a8">Interviewer on the call</text>
      <g stroke="#3a4a42" stroke-width="2" stroke-dasharray="6 6">
        <rect x="300" y="96" width="150" height="90" rx="10" fill="none"/>
      </g>
      <text x="375" y="147" text-anchor="middle" font-size="14" fill="#5c6b63">nothing here</text>
      <text x="24" y="262" font-size="15" fill="#c9d6cf">The overlay is gone from capture.</text>
      <text x="24" y="292" font-size="15" fill="#c9d6cf">No recorder or share can see it.</text>
    </g>
  </g>
</svg>
