    <circle cx="22" cy="17" r="5" fill="#00ff88"/>
    <text x="40" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00ff88" letter-spacing="1">COMPARISON</text>
  </g>
  <text x="80" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="900" fill="#ffffff" letter-spacing="-1">Yoodli: Practice</text>
  <text x="80" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="900" fill="#ffffff" letter-spacing="-1"><tspan fill="#2ecc71">vs Live</tspan> Interview AI</text>
  <text x="80" y="362" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" fill="#9fb3a8">Yoodli coaches you before. CloakAI helps</text>
  <text x="80" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="500" fill="#9fb3a8">you during. Two different jobs.</text>
  <g transform="translate(760,300)" font-family="Segoe UI, Arial, sans-serif">
    <circle cx="150" cy="0" r="160" fill="#2ecc71" fill-opacity="0.04" stroke="#2ecc71" stroke-opacity="0.14"/>
    <g transform="translate(20,-90)">
      <rect x="0" y="0" width="118" height="180" rx="14" fill="#0a1f15" stroke="#7f9488" stroke-opacity="0.4"/>
      <circle cx="59" cy="52" r="26" fill="none" stroke="#9fb3a8" stroke-width="4"/>
      <rect x="55" y="78" width="8" height="20" fill="#9fb3a8"/>
      <text x="59" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#c9d6cf">PRACTICE</text>
      <text x="59" y="150" text-anchor="middle" font-size="12" fill="#7f9488">before</text>
    </g>
    <text x="158" y="6" text-anchor="middle" font-size="20" font-weight="800" fill="#5b6e63">vs</text>
    <g transform="translate(182,-90)">
      <rect x="0" y="0" width="118" height="180" rx="14" fill="#0d2b1d" stroke="#00ff88" stroke-opacity="0.6"/>
      <rect x="20" y="30" width="78" height="44" rx="8" fill="#07130d" stroke="#00ff88" stroke-opacity="0.5"/>
      <circle cx="34" cy="44" r="5" fill="#00ff88"/>
      <rect x="46" y="40" width="40" height="7" rx="3" fill="#2ecc71" fill-opacity="0.6"/>
      <rect x="46" y="54" width="30" height="7" rx="3" fill="#2ecc71" fill-opacity="0.4"/>
      <text x="59" y="128" text-anchor="middle" font-size="15" font-weight="800" fill="#eaf3ee">LIVE</text>
      <text x="59" y="150" text-anchor="middle" font-size="12" fill="#9fb3a8">during</text>
