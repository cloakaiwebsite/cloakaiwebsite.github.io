  <text x="80" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="900" fill="#ffffff" letter-spacing="-1">for <tspan fill="#2ecc71">Interview Prep</tspan></text>
  <text x="80" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" fill="#9fb3a8">Which writes more natural answers, and</text>
  <text x="80" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" fill="#9fb3a8">what to actually use in the live interview.</text>
