  <text x="80" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="74" font-weight="900" fill="#ffffff" letter-spacing="-1">What Is <tspan fill="#2ecc71">Cloaked AI</tspan>?</text>
  <text x="80" y="326" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#c9d6cf">The invisible AI interview assistant, explained.</text>
  <text x="80" y="384" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#7f9488">Also spelled cloak ai, clock ai, cloaked ai, cloak gpt.</text>
