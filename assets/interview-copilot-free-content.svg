<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="How a real-time interview copilot works">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0d2b1d"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.55"><stop offset="0" stop-color="#00ff88" stop-opacity="0.28"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#2ecc71" stroke-opacity="0.06" stroke-width="1"><path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/><path d="M150 0V630M350 0V630M550 0V630M750 0V630M950 0V630"/></g>
  <text x="80" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">Listen, understand, suggest</text>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="80" y="230" width="240" height="120" rx="14" fill="#0a1f15" stroke="#2ecc71" stroke-opacity="0.5"/>
    <text x="200" y="290" text-anchor="middle" font-size="21" font-weight="800" fill="#eaf3ee">1. Listen</text>
    <text x="200" y="320" text-anchor="middle" font-size="14" fill="#9fb3a8">transcribe the question</text></g>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="400" y="230" width="240" height="120" rx="14" fill="#0a1f15" stroke="#2ecc71" stroke-opacity="0.5"/>
    <text x="520" y="290" text-anchor="middle" font-size="21" font-weight="800" fill="#eaf3ee">2. Understand</text>
    <text x="520" y="320" text-anchor="middle" font-size="14" fill="#9fb3a8">tailor to your resume</text></g>
  <g font-family="Segoe UI, Arial, sans-serif"><rect x="720" y="230" width="240" height="120" rx="14" fill="#0a1f15" stroke="#00ff88" stroke-opacity="0.5"/>
    <text x="840" y="290" text-anchor="middle" font-size="21" font-weight="800" fill="#eaf3ee">3. Suggest</text>
    <text x="840" y="320" text-anchor="middle" font-size="14" fill="#9fb3a8">answer on screen in ~1-2s</text></g>
  <path d="M328 290 h64" stroke="#00ff88" stroke-width="3" stroke-opacity="0.5"/><path d="M384 283 l10 7 l-10 7" fill="none" stroke="#00ff88" stroke-width="3"/>
  <path d="M648 290 h64" stroke="#00ff88" stroke-width="3" stroke-opacity="0.5"/><path d="M704 283 l10 7 l-10 7" fill="none" stroke="#00ff88" stroke-width="3"/>
  <text x="80" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6f8378">The copilot is a safety net: read the suggestion, then answer in your own words.</text>
</svg>