<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Parakeet AI, Chiku AI, LockedIn AI and CloakAI compared on price and invisibility">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0b2418"/></linearGradient>
  </defs>
  <rect width="1200" height="540" fill="url(#bg2)"/>
  <text x="600" y="64" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">Real-time interview AI, entry price compared</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- bars -->
    <g transform="translate(120,140)">
      <text x="0" y="0" font-size="20" font-weight="700" fill="#c9d6cf">Parakeet AI</text>
      <rect x="180" y="-22" width="760" height="30" rx="6" fill="#ef4444" fill-opacity="0.75"/>
      <text x="955" y="0" font-size="18" font-weight="700" fill="#ef4444">~₹2,650</text>
    </g>
    <g transform="translate(120,205)">
      <text x="0" y="0" font-size="20" font-weight="700" fill="#c9d6cf">LockedIn AI</text>
      <rect x="180" y="-22" width="840" height="30" rx="6" fill="#ef4444" fill-opacity="0.6"/>
      <text x="900" y="0" font-size="18" font-weight="700" fill="#f59e0b">$49.99/mo</text>
    </g>
    <g transform="translate(120,270)">
      <text x="0" y="0" font-size="20" font-weight="700" fill="#c9d6cf">Chiku AI</text>
      <rect x="180" y="-22" width="410" height="30" rx="6" fill="#f59e0b" fill-opacity="0.7"/>
      <text x="605" y="0" font-size="18" font-weight="700" fill="#f59e0b">₹1,199+GST</text>
    </g>
    <g transform="translate(120,335)">
      <text x="0" y="0" font-size="20" font-weight="800" fill="#eaf3ee">CloakAI</text>
      <rect x="180" y="-22" width="300" height="30" rx="6" fill="#2ecc71"/>
      <text x="495" y="0" font-size="18" font-weight="800" fill="#00ff88">₹999 / 3 hrs</text>
    </g>
    <g transform="translate(120,405)">
      <text x="0" y="0" font-size="20" font-weight="800" fill="#eaf3ee">CloakAI trial</text>
      <rect x="180" y="-22" width="60" height="30" rx="6" fill="#2ecc71" fill-opacity="0.5"/>
      <text x="255" y="0" font-size="18" font-weight="800" fill="#00ff88">Free · 20 min</text>
    </g>
    <text x="120" y="470" font-size="14" fill="#6f8378">Prices are indicative entry points in 2026 and are converted approximately for comparison.</text>
  </g>
</svg>
