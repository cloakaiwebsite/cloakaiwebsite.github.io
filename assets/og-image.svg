<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="CloakAI - The AI only you can see">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130d"/>
      <stop offset="1" stop-color="#0d2b1d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.6">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- logo + wordmark, centered row -->
  <image x="415" y="150" width="96" height="96" xlink:href="data:image/png;base64," style="border-radius:12px"/>
  <text x="527" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff">CloakAI</text>
  <!-- title -->
  <text x="600" y="368" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">The AI <tspan fill="#2ecc71">only you</tspan> can see</text>
  <!-- website -->
  <text x="600" y="452" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600" fill="#7f9488" letter-spacing="1">cloakai.in</text>
</svg>
