<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Live interview AI helper with real-time on-screen answers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0d2b1d"/></linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.55"><stop offset="0" stop-color="#00ff88" stop-opacity="0.3"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#2ecc71" stroke-opacity="0.06" stroke-width="1"><path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/><path d="M150 0V630M350 0V630M550 0V630M750 0V630M950 0V630"/></g>
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="182" height="34" rx="17" fill="#2ecc71" fill-opacity="0.12" stroke="#2ecc71" stroke-opacity="0.4"/>
    <circle cx="22" cy="17" r="6" fill="#ff4d4d"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <text x="42" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00ff88" letter-spacing="1">LIVE · REAL-TIME</text>
  </g>
  <text x="80" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1">Live Interview</text>
  <text x="80" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="-1">AI <tspan fill="#2ecc71">Helper</tspan></text>
  <text x="80" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" fill="#9fb3a8">Answers appear on your screen the moment</text>
  <text x="80" y="428" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" fill="#9fb3a8">a question is asked, hidden from screen share.</text>
  <!-- answer overlay on a call illustration -->
  <g transform="translate(820,170)">
    <rect x="0" y="0" width="300" height="290" rx="18" fill="#06120c" stroke="#2ecc71" stroke-opacity="0.2"/>
    <rect x="18" y="18" width="264" height="130" rx="10" fill="#0a1f15" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="70" cy="83" r="30" fill="#173a28"/>
    <path d="M70 70 a10 10 0 1 1 0 0.1 M52 104 c3 -12 33 -12 36 0" fill="none" stroke="#5b7a68" stroke-width="3"/>
    <text x="120" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f9488">Interviewer</text>
    <text x="120" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7f9488">on the call</text>
    <!-- overlay answer card -->
    <g transform="translate(150,120)">
      <rect x="0" y="0" width="150" height="150" rx="12" fill="#0d2b1d" stroke="#00ff88" stroke-opacity="0.7"/>
      <circle cx="20" cy="24" r="6" fill="#00ff88"/>
      <text x="36" y="29" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00ff88">Answer</text>
      <rect x="20" y="48" width="112" height="10" rx="5" fill="#2ecc71" fill-opacity="0.5"/>
      <rect x="20" y="70" width="90" height="10" rx="5" fill="#2ecc71" fill-opacity="0.35"/>
      <rect x="20" y="92" width="112" height="10" rx="5" fill="#2ecc71" fill-opacity="0.35"/>
      <rect x="20" y="120" width="86" height="18" rx="6" fill="#00ff88" fill-opacity="0.85"/>
      <text x="63" y="134" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#022c22">Only you</text>
    </g>
  </g>
  <g transform="translate(80,562)">
    <path d="M0 -12 L15 -4 V10 C15 20 8 28 0 31 C-8 28 -15 20 -15 10 V-4 Z" transform="translate(10,0)" fill="#2ecc71"/>
    <text x="34" y="6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">CloakAI</text>
    <text x="150" y="6" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6f8378">The AI only you can see</text>
  </g>
</svg>
