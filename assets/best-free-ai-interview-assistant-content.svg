<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="What a real free AI interview assistant should include">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130d"/>
      <stop offset="1" stop-color="#0b2418"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg2)"/>
  <text x="600" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="900" fill="#ffffff">What a genuinely <tspan fill="#2ecc71">free</tspan> interview AI must do</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(70,130)">
      <rect width="320" height="330" rx="18" fill="url(#tile)" stroke="#2ecc71" stroke-opacity="0.2"/>
      <circle cx="60" cy="70" r="34" fill="#2ecc71" fill-opacity="0.12" stroke="#2ecc71" stroke-opacity="0.4"/>
      <text x="60" y="82" text-anchor="middle" font-size="34">⚡</text>
      <text x="34" y="150" font-size="25" font-weight="800" fill="#ffffff">Real-time</text>
      <text x="34" y="184" font-size="25" font-weight="800" fill="#ffffff">answers</text>
      <text x="34" y="228" font-size="17" fill="#9fb3a8">Hears the question and</text>
      <text x="34" y="254" font-size="17" fill="#9fb3a8">replies while you speak,</text>
      <text x="34" y="280" font-size="17" fill="#9fb3a8">not after the call.</text>
    </g>
    <g transform="translate(440,130)">
      <rect width="320" height="330" rx="18" fill="url(#tile)" stroke="#2ecc71" stroke-opacity="0.2"/>
      <circle cx="60" cy="70" r="34" fill="#2ecc71" fill-opacity="0.12" stroke="#2ecc71" stroke-opacity="0.4"/>
      <text x="60" y="82" text-anchor="middle" font-size="34">🛡</text>
      <text x="34" y="150" font-size="25" font-weight="800" fill="#ffffff">Invisible on</text>
      <text x="34" y="184" font-size="25" font-weight="800" fill="#ffffff">screenshare</text>
      <text x="34" y="228" font-size="17" fill="#9fb3a8">Hidden from Zoom, Teams</text>
      <text x="34" y="254" font-size="17" fill="#9fb3a8">and Meet at the OS level,</text>
      <text x="34" y="280" font-size="17" fill="#9fb3a8">not just a hope.</text>
    </g>
    <g transform="translate(810,130)">
      <rect width="320" height="330" rx="18" fill="url(#tile)" stroke="#2ecc71" stroke-opacity="0.2"/>
      <circle cx="60" cy="70" r="34" fill="#2ecc71" fill-opacity="0.12" stroke="#2ecc71" stroke-opacity="0.4"/>
      <text x="60" y="82" text-anchor="middle" font-size="34">🎯</text>
      <text x="34" y="150" font-size="25" font-weight="800" fill="#ffffff">Personalised</text>
      <text x="34" y="184" font-size="25" font-weight="800" fill="#ffffff">to your resume</text>
      <text x="34" y="228" font-size="17" fill="#9fb3a8">Answers sound like you,</text>
      <text x="34" y="254" font-size="17" fill="#9fb3a8">using your real projects</text>
      <text x="34" y="280" font-size="17" fill="#9fb3a8">and experience.</text>
    </g>
  </g>
</svg>
