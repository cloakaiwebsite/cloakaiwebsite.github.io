    <text x="820" y="372" text-anchor="middle" font-size="16" fill="#9fb3a8">DURING the interview</text>
  </g>
  <text x="80" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6f8378">The best-prepared candidates often use one to prepare and the other to perform.</text>
