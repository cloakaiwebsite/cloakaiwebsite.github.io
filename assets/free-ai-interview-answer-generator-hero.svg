<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Free AI interview answer generator with real-time voice answers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0d2b1d"/></linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.55"><stop offset="0" stop-color="#00ff88" stop-opacity="0.3"/><stop offset="1" stop-color="#00ff88" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#2ecc71" stroke-opacity="0.06" stroke-width="1"><path d="M0 105H1200M0 210H1200M0 315H1200M0 420H1200M0 525H1200"/><path d="M150 0V630M350 0V630M550 0V630M750 0V630M950 0V630"/></g>
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="232" height="34" rx="17" fill="#2ecc71" fill-opacity="0.12" stroke="#2ecc71" stroke-opacity="0.4"/>
    <circle cx="22" cy="17" r="5" fill="#00ff88"/>
    <text x="40" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#00ff88" letter-spacing="1">REAL-TIME · BY VOICE</text>
  </g>
  <text x="80" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1"><tspan fill="#2ecc71">Free</tspan> AI Interview</text>
  <text x="80" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-1">Answer Generator</text>
  <text x="80" y="390" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" fill="#9fb3a8">It hears the question by voice and writes</text>
  <text x="80" y="426" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="500" fill="#9fb3a8">your answer live, only you can see it.</text>
  <!-- mic -> waveform -> answer illustration -->
  <g transform="translate(880,300)">
    <circle cx="0" cy="0" r="150" fill="#2ecc71" fill-opacity="0.05" stroke="#2ecc71" stroke-opacity="0.2"/>
    <!-- mic -->
    <g transform="translate(-92,0)">
      <rect x="-16" y="-46" width="32" height="60" rx="16" fill="#0d2b1d" stroke="#00ff88" stroke-width="3"/>
      <path d="M-26 4 C-26 26 26 26 26 4" fill="none" stroke="#00ff88" stroke-width="3"/>
      <line x1="0" y1="26" x2="0" y2="44" stroke="#00ff88" stroke-width="3"/>
    </g>
    <!-- waveform -->
    <g stroke="#00ff88" stroke-width="7" stroke-linecap="round" opacity="0.95">
      <line x1="-40" y1="-20" x2="-40" y2="20"/>
      <line x1="-16" y1="-40" x2="-16" y2="40"/>
      <line x1="8" y1="-28" x2="8" y2="28"/>
      <line x1="32" y1="-48" x2="32" y2="48"/>
    </g>
    <!-- answer card -->
    <g transform="translate(70,-52)">
      <rect x="0" y="0" width="118" height="104" rx="12" fill="#0a1f15" stroke="#2ecc71" stroke-opacity="0.4"/>
      <circle cx="18" cy="20" r="5" fill="#00ff88"/>
      <rect x="30" y="15" width="70" height="10" rx="5" fill="#2ecc71" fill-opacity="0.5"/>
      <rect x="16" y="42" width="86" height="9" rx="4" fill="#2ecc71" fill-opacity="0.4"/>
      <rect x="16" y="60" width="66" height="9" rx="4" fill="#2ecc71" fill-opacity="0.3"/>
      <rect x="16" y="78" width="86" height="9" rx="4" fill="#2ecc71" fill-opacity="0.3"/>
    </g>
  </g>
  <g transform="translate(80,562)">
    <path d="M0 -12 L15 -4 V10 C15 20 8 28 0 31 C-8 28 -15 20 -15 10 V-4 Z" transform="translate(10,0)" fill="#2ecc71"/>
    <text x="34" y="6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#ffffff">CloakAI</text>
    <text x="150" y="6" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6f8378">The AI only you can see</text>
  </g>
</svg>
